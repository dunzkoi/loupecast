name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: App version}
    validations: {required: true}
  - type: input
    id: os
    attributes: {label: OS version}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. ...\n2. ...\n3. ..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected vs actual}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Logs or crash report, render: text}
