name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # A PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger CI or the title check.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  build-macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # One fixed self-signed identity: the designated requirement stays the same across releases,
      # so macOS keeps the Screen Recording grant after an update.
      - name: Import signing identity
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KP="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          rm "$RUNNER_TEMP/cert.p12"
      - run: ./build.sh
        env:
          LOUPECAST_SIGN_ID: Loupecast Release
      - name: Guard against an unstable signature
        run: codesign -d -r- dist/Loupecast.app 2>&1 | grep -q 'certificate leaf = H"14483067735e80133538834400a7dc458392ad4c"'
      - name: Guard against debug/dev-path builds
        run: "! strings dist/Loupecast.app/Contents/MacOS/Loupecast | grep -E '/Users/[^/]+/'"
      - name: Zip
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd dist
          ditto -c -k --keepParent Loupecast.app "Loupecast-$TAG.zip"
          cp "Loupecast-$TAG.zip" Loupecast.zip
          shasum -a 256 ./*.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
